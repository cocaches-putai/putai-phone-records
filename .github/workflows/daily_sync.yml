name: 🤖 每日電話紀錄自動雲端同步

on:
  schedule:
    # 每天台北時間 07:15 (UTC 23:15) 自動執行
    - cron: '15 23 * * *'
  workflow_dispatch: # 支援手動一鍵觸發

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 下載倉庫程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安裝相依套件
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 執行 Gmail 雲端抓取與網頁編譯
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          CI: 'true'
        run: |
          python scripts/cloud_sync.py

      - name: 📤 自動推送更新至 GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "沒有任何新資料變動，無需推送。"
          else
            git commit -m "🤖 自動雲端同步：更新電話紀錄與追蹤儀表板 [skip ci]"
            git push origin main
          fi
