<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      
      --red-bg: #fef2f2;
      --red-border: #fecaca;
      --red-text: #b91c1c;

      --yellow-bg: #fffbeb;
      --yellow-border: #fde68a;
      --yellow-text: #b45309;

      --green-bg: #f0fdf4;
      --green-border: #bbf7d0;
      --green-text: #15803d;

      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans TC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 70px;
    }

    /* Passcode Lock Screen Overlay */
    #lockOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .lock-card {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      padding: 28px 24px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.3s ease-out;
    }

    .lock-icon {
      font-size: 2.8rem;
      margin-bottom: 12px;
    }

    .lock-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .lock-desc {
      font-size: 0.82rem;
      color: #64748b;
      margin-bottom: 20px;
    }

    .lock-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1.05rem;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .lock-input:focus {
      border-color: #2563eb;
    }

    .lock-btn {
      width: 100%;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
    }

    .lock-btn:active {
      transform: scale(0.98);
    }

    .lock-error {
      font-size: 0.8rem;
      color: #dc2626;
      margin-top: 10px;
      display: none;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: white;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .school-title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-live {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 20px;
      color: #93c5fd;
    }

    .search-wrapper {
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border: none;
      padding: 9px 14px 9px 36px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #1e293b;
      outline: none;
    }

    .search-input::placeholder {
      color: #94a3b8;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 0.85rem;
      pointer-events: none;
    }

    .stat-collapse-btn {
      width: 100%;
      background: #ffffff;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
    }

    .official-stats-panel {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px 14px 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .stat-chip {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .stat-chip:active, .stat-chip.active {
      background: #eff6ff;
      border-color: #3b82f6;
    }

    .chip-code {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .chip-name {
      font-size: 0.76rem;
      font-weight: 600;
      color: #1e293b;
    }

    .chip-count {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-light);
    }

    .filter-tabs-wrapper {
      background: #ffffff;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 86px;
      z-index: 90;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .filter-tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    .filter-tabs {
      display: inline-flex;
      gap: 6px;
    }

    .tab-btn {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid transparent;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
    }

    main {
      padding: 12px 16px;
      max-width: 760px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .case-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .case-card.highlight-red {

      background: #fffafa;
    }

    .case-card.highlight-yellow {
      border-left: 4px solid #d97706;
      background: #fffdfa;
    }

    .case-card.highlight-green {
      border-left: 4px solid #16a34a;
      background: #fcfdfc;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .code-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #e2e8f0;
      color: #334155;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .code-badge.c1 { background: #dbeafe; color: #1e40af; }
    .code-badge.c2 { background: #fce7f3; color: #9d174d; }
    .code-badge.c3 { background: #fef3c7; color: #92400e; }
    .code-badge.c4 { background: #e0e7ff; color: #3730a3; }
    .code-badge.c8 { background: #ede9fe; color: #5b21b6; }
    .code-badge.c9 { background: #ccfbf1; color: #115e59; }
    .code-badge.c11 { background: #fae8ff; color: #86198f; }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .caller-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .content-box {
      font-size: 0.85rem;
      color: #334155;
      margin-bottom: 8px;
    }

    .action-box {
      font-size: 0.8rem;
      color: #475569;
      background: #f8fafc;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      border-left: 2px solid #cbd5e1;
    }

    .follow-up-box {
      font-size: 0.8rem;
      color: #0c4a6e;
      background: #f0f9ff;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px dashed #7dd3fc;
      margin-top: 6px;
    }

    .teachers-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .teacher-pill {
      font-size: 0.72rem;
      background: #f1f5f9;
      color: #1e293b;
      padding: 1px 6px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #f1f5f9;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
  </style>
</head>

  <script>
    const CORRECT_PASS = "putai";

    function checkAuth() {
      const saved = localStorage.getItem("putai_auth_v2");
      if (saved === "ok") {
        unlockApp();
      }
    }

    function verifyPasscode() {
      const val = document.getElementById("passcodeInput").value.trim().toLowerCase();
      if (val === CORRECT_PASS) {
        localStorage.setItem("putai_auth_v2", "ok");
        unlockApp();
      } else {
        const err = document.getElementById("lockError");
        const card = document.getElementById("lockCard");
        err.style.display = "block";
        card.style.animation = "shake 0.3s";
        setTimeout(() => { card.style.animation = ""; }, 300);
      }
    }

    function unlockApp() {
      document.getElementById("lockOverlay").style.display = "none";
      document.getElementById("mainApp").style.display = "block";
      document.getElementById("appBody").style.display = "block";
      render();

    let currentFilter = 'all';
    let searchQuery = '';

    function render() {
      const container = document.getElementById('cardsContainer');
      const filtered = records.filter(item => {
        let matchCat = true;
        if (currentFilter === 'red') matchCat = (item.level === 'red');
        else if (currentFilter === 'yellow') matchCat = (item.level === 'yellow');
        else if (currentFilter === 'green') matchCat = (item.level === 'green');
        else if (currentFilter !== 'all') matchCat = (item.code === currentFilter);

        let matchSearch = true;
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const fullText = (item.date + item.time + item.caller + item.content + item.action + item.dept_name + (item.teachers||[]).join(' ') + (item.follow_up||'')).toLowerCase();
          matchSearch = fullText.includes(q);
        }
        return matchCat && matchSearch;
      });

      document.getElementById('matchCount').innerText = `共 ${filtered.length} 筆`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size:2rem;">📭</div>
            <p>沒有符合條件的電話紀錄</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isRed = item.level === 'red';
        const isYellow = item.level === 'yellow';
        const isGreen = item.level === 'green';
        const highlightClass = isRed ? 'highlight-red' : isYellow ? 'highlight-yellow' : isGreen ? 'highlight-green' : '';

        const teachersHtml = (item.teachers && item.teachers.length > 0) ? `
          <div class="teachers-tags">
            <span style="font-size:0.72rem; color:#64748b; font-weight:600;">👤 主責師長：</span>
            ${item.teachers.map(t => `<span class="teacher-pill">${t}</span>`).join('')}
          </div>
        ` : '';

        const followUpHtml = item.follow_up ? `
          <div class="follow-up-box">
            <strong>💬 處置追蹤：</strong> ${item.follow_up}
          </div>
        ` : '';

        return `
          <div class="case-card ${highlightClass}">
            <div class="card-top">
              <span class="code-badge c${item.code}">
                [${item.code}] ${item.dept_name}
              </span>
              <span class="card-time">📅 ${item.date} ${item.time}</span>
            </div>

            <div class="caller-name">
              ${isRed ? '🔴 ' : isYellow ? '🟡 ' : isGreen ? '🟢 ' : ''}${item.caller}
            </div>

            <div class="content-box">
              ${item.content}
            </div>

            <div class="action-box">
              <strong>處理說明：</strong>${item.action}
            </div>

            ${teachersHtml}
            ${followUpHtml}

            <div class="card-footer">
              <span>處置代號：${item.code} ${item.dept_name}</span>
              <span>值勤：${item.handler || '護學會'}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCategory(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      render();
    }

    function filterByCode(code) {
      currentFilter = code;
      document.querySelectorAll('.tab-btn').forEach(b => {
        if (b.innerText.startsWith(code + ' ') || (code === 'all' && b.innerText.startsWith('全部'))) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });
      render();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value;
      render();
    }

    function toggleStats() {
      const panel = document.getElementById('statsPanel');
      const arrow = document.getElementById('statArrow');
      if (panel.style.display === 'none') {
        panel.style.display = 'grid';
        arrow.innerText = '▼';
      } else {
        panel.style.display = 'none';
        arrow.innerText = '▶';
      }
    }

    // Check auth on load
    checkAuth();
